# Suite unitaria de la app.
#
# Existe porque no existia: los tests estaban ahi y no los ejecutaba nada, asi
# que una divergencia podia mergearse sin que nadie se enterara. Entre ellos va
# StorableSchemaContractTest, que comprueba que el catalogo de tipos de la
# boveda no se ha separado de AcheronSchema -- el contrato que comparten esta
# app, la API, la SPA y el motor Java. Ese fallo es silencioso: un campo
# renombrado en un solo sitio no viaja, y el usuario ve el hueco mucho despues.
name: Tests

on:
  push:
    branches: [main, develope]
  pull_request:
    branches: [main, develope]

jobs:
  unit:
    name: Suite unitaria
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # El SDK de Android hace falta para compilar el modulo, aunque los tests
      # sean JVM puros: el plugin de Android lo exige para configurar el build.
      #
      # `packages: ''` no es decoracion. Por defecto esta accion instala el
      # paquete `tools`, que Google RETIRO del repositorio del SDK, asi que
      # sdkmanager sale con "Failed to find package 'tools'" y tumba el job
      # antes de compilar nada. Vaciando la lista se instalan solo las
      # cmdline-tools, que es lo unico que hace falta: lo demas lo resuelve el
      # plugin de Android desde el build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # La app depende de com.ellysia:acheron-core, que publica OTRO
      # repositorio: ProjectEllysia/AcheronCore.
      #
      # Esto es lo que tumbo a esta CI cuando se escribio, en septiembre de
      # 2026, y conviene dejar escrito por que ya no la tumba. Entonces
      # AcheronCore era privado, y los paquetes Maven de GitHub Packages son
      # siempre de REPOSITORIO --la URL del registry lleva el repo dentro-- y
      # heredan sus permisos, sin ofrecer el "Manage Actions access" que si
      # tienen los de organizacion. El GITHUB_TOKEN del runner solo alcanza a
      # ESTE repositorio, asi que la lectura devolvia un 404: GitHub Packages
      # oculta asi lo que existe pero no puedes ver. Hacia falta un PAT en un
      # secreto, el secreto nunca se creo, y la rama se quedo sin fusionar.
      #
      # Hoy AcheronCore es PUBLICO y su paquete Maven tambien, de modo que el
      # GITHUB_TOKEN del runner basta. Siguen haciendo falta credenciales
      # --GitHub Packages no permite descargas anonimas ni de paquetes
      # publicos--, pero ya no hace falta un PAT.
      #
      # Si algun dia AcheronCore volviera a ser privado, esto rompe otra vez, y
      # la salida vuelve a ser un PAT con read:packages y repo.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sin esto, un fallo obliga a reproducirlo en local para ver que aserto
      # rompio. Con el informe subido se lee desde la propia ejecucion.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
